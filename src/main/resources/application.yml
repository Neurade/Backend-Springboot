spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:true}
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    placeholders:
      csv_file: ${CSV_FILE}
      api_key: ${LLM_API_KEY}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      repositories:
        enabled: false

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        concurrency: 2
        max-concurrency: 5
        prefetch: 1

minio:
  url: http://${MINIO_HOST}:${MINIO_PORT}
  access-key: ${MINIO_ACCESS}
  secret-key: ${MINIO_SECRET}
  bucket:
    pfp: ${MINIO_BUCKET_PFP:neurade-pfp}
    chat: ${MINIO_BUCKET_CHAT:neurade-chat}
    assignment: ${MINIO_BUCKET_ASSIGNMENT:neurade-assignment}

llm:
  provider: ${LLM_PROVIDER:gemini}
  api-key: ${LLM_API_KEY}
  model: ${LLM_MODEL:gemini-2.5-flash}
  top-k: ${LLM_TOP_K:5}
  validate:
    endpoint: ${LLM_VALIDATE_ENDPOINT}
  qa:
    endpoint: ${LLM_QA_ENDPOINT}
  ws:
    endpoint: ${LLM_WS_ENDPOINT}
  assignment-ocr:
    endpoint: ${LLM_ASSIGNMENT_OCR_ENDPOINT}
  timeout: ${LLM_TIMEOUT_SECONDS:180}

application:
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      expiration: ${JWT_EXPIRATION:86400000} # 1 day
      refresh-token:
        expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days

logging:
  level:
    org.springframework.cache: TRACE

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

server:
  forward-headers-strategy: framework

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
    disable-swagger-default-url: true